<ion-content class="ion-padding">

  <h1>Batting Average</h1>

  <ion-item>
    <ion-input
      type="number"
      placeholder="Total Runs"
      [(ngModel)]="runs">
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-input
      type="number"
      placeholder="Times Out"
      [(ngModel)]="outs">
    </ion-input>
  </ion-item>

  <ion-button
    expand="block"
    (click)="calculateAverage()">

    Calculate

  </ion-button>

  <h2>{{ result }}</h2>

</ion-content>
