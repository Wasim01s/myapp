<ion-content class="ion-padding">

  <h1>Bowling Average</h1>

  <ion-item>
    <ion-input
      type="number"
      placeholder="Runs Conceded"
      [(ngModel)]="runs">
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-input
      type="number"
      placeholder="Wickets Taken"
      [(ngModel)]="wickets">
    </ion-input>
  </ion-item>

  <ion-button
    expand="block"
    (click)="calculateAverage()">

    Calculate

  </ion-button>

  <h2>{{ result }}</h2>

</ion-content>
